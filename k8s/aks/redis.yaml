apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis-cache}
  template:
    metadata:
      labels: {app: redis-cache}
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{name: redis, containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
spec:
  selector: {app: redis-cache}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-queue
spec:
  serviceName: redis-queue
  replicas: 1
  selector:
    matchLabels: {app: redis-queue}
  template:
    metadata:
      labels: {app: redis-queue}
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{name: redis, containerPort: 6379}]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: managed-csi-premium
        resources:
          requests: {storage: 8Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-queue
spec:
  selector: {app: redis-queue}
  ports: [{name: redis, port: 6379, targetPort: redis}]
